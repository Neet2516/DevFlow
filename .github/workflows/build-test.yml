name: Build & Test Suite

on:
  push:
    branches: [ main, docs/update-security-policy ]
  pull_request:
    branches: [ main, docs/update-security-policy ]

jobs:
  build-and-test:
    name: Build & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: devflow
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1. Install Dependencies
        run: npm install

      - name: 2. Generate Prisma Client & Push DB Schema
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5433/devflow?schema=public"
        run: |
          npm run db:generate -w @devflow/db
          npx prisma db push --schema=packages/db/prisma/schema.prisma --skip-generate

      - name: 3. Build Core Packages
        run: |
          npm run build -w @devflow/shared
          npm run build -w @devflow/auth
          npm run build -w @devflow/db
          npm run build -w @devflow/logger
          npm run build -w @devflow/metrics
          npm run build -w @devflow/graph-engine
          npm run build -w @devflow/scheduler
          npm run build -w @devflow/templates

      - name: 4. Compile & Build All Workspaces
        run: npm run build

      - name: 5. Run Integration & Unit Test Suite
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5433/devflow?schema=public"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "test_secret_ci"
        run: npm test
