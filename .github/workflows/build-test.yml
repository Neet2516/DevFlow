name: Build & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: devflow
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 1. Install Dependencies
        run: npm ci

      - name: 2. Run Typecheck & Lint
        run: npm run lint

      - name: 3. Compile & Build Workspaces
        run: npm run build

      - name: 4. Run Integration & Unit Test Suite
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5433/devflow?schema=public"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "test_secret_ci"
        run: npm test
