global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: devflow-execution
    static_configs:
      - targets: ['execution:3002']
    metrics_path: /metrics

  - job_name: devflow-pipeline
    static_configs:
      - targets: ['pipeline:3001']
    metrics_path: /metrics

  - job_name: devflow-websocket
    static_configs:
      - targets: ['websocket:3003']
    metrics_path: /metrics
